{% extends "layout.html" %}
{% block contenido %}
<h2>Panel de Administración</h2>
<a href="{{ url_for('agregar_producto') }}">
    <button>➕ Agregar Gorra</button>
</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>
    {% for producto in productos %}
    <tr>
        <td>{{ producto.id_producto }}</td>
        <td>{{ producto.modelo }}</td>
        <td>{{ producto.marca }}</td>
        <td>${{ producto.precio }}</td>
        <td>
            <<a href="{{ url_for('editar_producto', id=producto.id_producto) }}">
        <button>Editar</button>
    </a>
            <a href="{{ url_for('eliminar_producto', id=producto.id_producto) }}"
    onclick="return confirm('¿Estás seguro de eliminar esta gorra?');">
    <button>Eliminar</button>
</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
