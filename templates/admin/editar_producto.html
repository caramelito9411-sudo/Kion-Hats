{% extends "layout.html" %}
{% block contenido %}
<h2>Editar gorra</h2>
<form method="POST">
<label>Modelo</label><br>
<input type="text" name="modelo" value="{{ producto.modelo }}" required><br><br>
<label>Descripción</label><br>
<textarea name="descripcion">{{ producto.descripcion }}</textarea><br><br>
<label>Precio</label><br>
<input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required><br><br>
<label>Stock</label><br>
<input type="number" name="stock" value="{{ producto.stock }}" required><br><br>
<label>Imagen</label><br>
<input type="text" name="imagen" value="{{ producto.imagen }}"><br><br>
<label>Marca</label><br>
<select name="id_marca">
{% for marca in marcas %}
<option value="{{ marca.id_marca }}"
{% if marca.id_marca == producto.id_marca %}
selected
{% endif %}
>
{{ marca.nombre }}
</option>
{% endfor %}
</select>
<br><br>
<button type="submit">Guardar cambios</button>
</form>
{% endblock %}
