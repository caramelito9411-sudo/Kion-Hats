<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kion Hats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<header>
    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo">
    </div>
    <nav>
        <a href="{{ url_for('inicio') }}">Inicio</a>
        <a href="{{ url_for('catalogo') }}">Catálogo</a>
        <a href="#">Marcas</a>
        <a href="{{ url_for('carrito') }}">🛒 Carrito</a>
        <a href="{{ url_for('login') }}">Iniciar sesión</a>
        <a href="{{ url_for('registro') }}">Registrarse</a>
        <a href="{{ url_for('logout') }}">Cerrar sesión</a>
        <a href="{{ url_for('mis_pedidos') }}">Mis pedidos</a>
        {% if session.get("rol") == "admin" %}
        <a href="{{ url_for('admin') }}">Administrador</a>
        {% endif %}
    </nav>
</header>
<main>
{% block contenido %}
{% endblock %}
</main>
<footer>
    <h3>KION HATS</h3>
    <p>© 2026 Todos los derechos reservados.</p>
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
