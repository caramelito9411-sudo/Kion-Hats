{% extends 'layout.html' %}
{% block contenido %}
<div class="contenedor-formulario">
    <h1>Crear cuenta</h1>
    <form action="{{ url_for('registro') }}" method="POST">
        <input
            type="text"
            name="nombre"
            placeholder="Nombre"
            required
        >
        <input
            type="text"
            name="apellido"
            placeholder="Apellido"
            required
        >
        <input
            type="email"
            name="correo"
            placeholder="Correo electrónico"
            required
        >
        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
        >
        <input
            type="text"
            name="telefono"
            placeholder="Teléfono"
        >
        <input
            type="text"
            name="direccion"
            placeholder="Dirección"
        >
        <button type="submit" class="boton">
            Registrarse
        </button>
    </form>
</div>
{% endblock %}
